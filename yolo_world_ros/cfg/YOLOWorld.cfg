#!/usr/bin/env python
from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Enum for prompt source
prompt_enum = gen.enum([
    gen.const("MANUAL", int_t, 0, "Use manual text_prompts"),
    gen.const("FILE", int_t, 1, "Use text_prompt_file"),
    gen.const("AUTO", int_t, 2, "Use VLM tagger auto prompts"),
], "Prompt source")

gen.add("prompt_source", int_t, 0, "Prompt source (0=manual, 1=file, 2=auto)", 2, 0, 2, edit_method=prompt_enum)

gen.add("text_prompts", str_t, 0, "Text prompts for object detection, separated by commas. Used when prompt_source=manual.", "person, car, dog")
gen.add("text_prompt_file", str_t, 0, "Path to a text or JSON file with prompts. Used when prompt_source=file.", "data/texts/gpt_indoor_general.json")

# VLM tagger settings
gen.add("tagger_url", str_t, 0, "VLM tagger endpoint URL", "http://localhost:59810/tag")
gen.add("tagger_fps", double_t, 0, "Max request rate to the tagger (Hz)", 1.0, 0.0, 30.0)
gen.add("tagger_timeout", double_t, 0, "HTTP timeout for the tagger (seconds)", 10.0, 0.0, 120.0)

gen.add("score_threshold", double_t, 0, "Confidence score threshold for predictions", 0.3, 0, 1)
gen.add("top_k", int_t, 0, "Keep top-k predictions", 20, 1, 100)
gen.add("use_amp", bool_t, 0, "Use mixed precision for inference", False)
gen.add("visualize", bool_t, 0, "Publish annotated image", True)

# Visualization parameters
gen.add("hud_font_scale", double_t, 0, "Font scale for overlay metrics text", 1, 0.1, 5)

gen.add("bbox_thickness", int_t, 0, "Bounding box line thickness (px)", 2, 1, 10)

gen.add("label_font_scale", double_t, 0, "Font scale for label text", 0.6, 0.2, 3.0)
gen.add("label_text_thickness", int_t, 0, "Thickness for label text", 1, 1, 5)

# Palette parameters (OKLCh)
gen.add("palette_lightness", double_t, 0, "OKLCh lightness L (0.0-1.0)", 0.62, 0.0, 1.0)
gen.add("palette_chroma", double_t, 0, "OKLCh chroma C (0.0-0.5 typical gamut-safe)", 0.18, 0.0, 0.5)

# HUD visibility toggles
gen.add("show_detector_hud", bool_t, 0, "Show detector latency HUD text", True)
gen.add("show_tagger_hud", bool_t, 0, "Show tagger latency HUD text", True)
gen.add("show_scene_hud", bool_t, 0, "Show scene label HUD text", True)
gen.add("show_zupt_hud", bool_t, 0, "Show ZUPT (cached frame) indicator HUD text", True)

# Zero-Update (ZUPT) parameters - skip inference when image is unchanged
gen.add("zupt_enable", bool_t, 0, "Enable Zero-Update to skip inference on unchanged images", True)
gen.add("zupt_threshold", double_t, 0, "MAD threshold for change detection (0=identical, 255=max)", 3.0, 0.0, 50.0)
gen.add("zupt_min_interval_sec", double_t, 0, "Force inference after this interval even if unchanged", 10.0, 0.0, 60.0)
gen.add("zupt_downscale_size", int_t, 0, "Downsampled comparison size (NxN)", 64, 16, 256)
gen.add("zupt_republish_cached", bool_t, 0, "Republish cached detections when skipping inference", False)

exit(gen.generate(
    "yolo_world_ros", "yolo_world_ros", "YOLOWorld"))
